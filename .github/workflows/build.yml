name: Build & Publish (GitHub Actions -> GitLab)

# GitLab 存源码(唯一事实源),GitHub 负责构建并把产物发布回 GitLab:
#   1. 直接从 GitLab 克隆源码(GITLAB_TOKEN)
#   2. applyAllPatches + createPaperclipJar(JDK 25)
#   3. 上传 GitLab Generic Package 并创建/刷新 Release(tag: ver-<MC>-<BUILD>)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
  # URL-encoded project path for GitLab API
  GITLAB_PROJECT: "vospek%2Fminecraft-dev%2Fleviathan"

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (paperweight caches are multi-GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Checkout source from GitLab
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git clone "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/vospek/minecraft-dev/leviathan.git" .
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Export version info
        run: |
          echo "MC_VERSION=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Apply patches and build paperclip jar
        run: ./gradlew applyAllPatches createPaperclipJar --stacktrace --no-daemon

      - name: Prepare release notes and rename jar
        run: |
          chmod +x ./scripts/prepareRelease.sh
          export CI_PROJECT_PATH="vospek/minecraft-dev/leviathan"
          ./scripts/prepareRelease.sh

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: leviathan-${{ env.MC_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            leviathan-*.jar
            release_notes.md
          if-no-files-found: error

      - name: Publish jar to GitLab Generic Package
        run: |
          JAR="leviathan-${MC_VERSION}-${BUILD_NUMBER}.jar"
          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            --upload-file "./$JAR" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}/packages/generic/leviathan/${MC_VERSION}/$JAR"

      - name: Create or refresh GitLab Release
        run: |
          TAG="ver-${MC_VERSION}-${BUILD_NUMBER}"
          API="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT}"
          ASSET_URL="${API}/packages/generic/leviathan/${MC_VERSION}/leviathan-${MC_VERSION}-${BUILD_NUMBER}.jar"
          # 同 tag 旧 Release 先删,保持与 prepareRelease.sh 一致的幂等语义
          curl --silent --request DELETE \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            "$API/releases/$TAG" > /dev/null || true
          jq -n \
            --arg tag "$TAG" \
            --arg ref "$GIT_SHA" \
            --arg name "Leviathan ${MC_VERSION} build ${BUILD_NUMBER}" \
            --rawfile desc release_notes.md \
            --arg url "$ASSET_URL" \
            '{tag_name:$tag, ref:$ref, name:$name, description:$desc,
              assets:{links:[{name:"Leviathan paperclip jar", url:$url}]}}' > body.json
          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data @body.json "$API/releases"
          echo "### GitLab Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asset: $ASSET_URL" >> "$GITHUB_STEP_SUMMARY"
