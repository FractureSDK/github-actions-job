name: Build & Release (GitHub Actions)

# 架构: GitLab 存源码(唯一事实源),GitHub 负责构建与发布
#   1. 直接从 GitLab 克隆源码(GITLAB_TOKEN, 只读 scope read_repository 即可)
#   2. applyAllPatches + createPaperclipJar(JDK 25)
#   3. 发布到本仓库的 GitHub Releases(tag: ver-<MC>-<BUILD>, 公开可下载)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # GitHub Release 创建需要写 contents(tag + 资产)
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (paperweight caches are multi-GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Checkout source from GitLab
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git clone "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/vospek/minecraft-dev/leviathan.git" .
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Export version info
        run: |
          echo "MC_VERSION=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Apply patches
        # 单独执行: applyAllPatches 会生成 leviathan-server/build.gradle.kts(gitignored),
        # 之后第二次 Gradle 调用才能配置出 paperweight core 的 createPaperclipJar 任务
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build paperclip jar
        run: ./gradlew :leviathan-server:createPaperclipJar --stacktrace --no-daemon

      - name: Prepare release notes and rename jar
        run: |
          chmod +x ./scripts/prepareRelease.sh
          export CI_PROJECT_PATH="vospek/minecraft-dev/leviathan"
          ./scripts/prepareRelease.sh

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: leviathan-${{ env.MC_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            leviathan-*.jar
            release_notes.md
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ver-${MC_VERSION}-${BUILD_NUMBER}"
          # 同 tag 旧 Release 先删,保持幂等(工作流重跑时刷新资产)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --title "Leviathan ${MC_VERSION} build ${BUILD_NUMBER}" \
            --notes-file release_notes.md \
            "./leviathan-${MC_VERSION}-${BUILD_NUMBER}.jar"
          echo "### GitHub Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
